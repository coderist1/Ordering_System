databases:
  - name: ordering-system-db
    plan: free
    databaseName: ordering_system
    user: ordering_system

services:
  # Backend (Django)
  - type: web
    name: ordering-system-backend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: python -m pip install --upgrade pip setuptools wheel && python -m pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ordering-system-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://ordering-system-6rn1.vercel.app   # ← Update this to your actual Vercel frontend URL after redeploy
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1,.onrender.com

      # Email configuration (Gmail SMTP)
      # IMPORTANT: Set EMAIL_HOST_PASSWORD only in the Render Dashboard (never commit it here)
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_HOST_USER
        value: mathewpolinar5@gmail.com          # ← Replace with your real Gmail
      - key: DEFAULT_FROM_EMAIL
        value: mathewpolinar5@gmail.com          # ← Replace with your real Gmail

  # Frontend (React - Static Site)
  - type: web
    name: ordering-system-1-up16
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://ordering-system-backend.onrender.com   # ← Update this if your backend URL is different
